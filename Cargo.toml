[package]
name = "rsnumpy"
version = "1.1.4"
edition = "2024"

[lib]
name = "rsnumpy"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
# matrixmultiply-threading：非 BLAS 平台上让纯 Rust GEMM 内核多线程并行。
ndarray = { version = "0.17.2", features = [
    "rayon",
    "serde",
    "matrixmultiply-threading",
] }
rayon = "1.12.0"
rand = "0.10.2"
rand_distr = "0.6.0"
num-traits = "0.2.19"
rustfft = "6.4.1"
zip = "8.6.0"
num-complex = "0.4.6"
thiserror = "2.0.0"

# macOS：链接系统自带的 Accelerate 框架作为 BLAS 后端（无需额外安装），
# matmul/dot 由 ndarray 的 blas 特性自动分派到原生高性能 GEMM。
# 其它平台不启用 BLAS，自动回退到上面的 matrixmultiply 多线程纯 Rust 内核。
[target.'cfg(target_os = "macos")'.dependencies]
ndarray = { version = "0.17.2", features = ["blas"] }
blas-src = { version = "0.10", features = ["accelerate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"