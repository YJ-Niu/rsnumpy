[package]
name = "rsnumpy"
version = "1.1.3"
edition = "2024"

[lib]
name = "rsnumpy"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
ndarray = { version = "0.17.2", features = ["rayon", "serde"] }
rayon = "1.12.0"
rand = "0.10.2"
rand_distr = "0.6.0"
num-traits = "0.2.19"
rustfft = "6.4.1"
zip = "8.6.0"
num-complex = "0.4.6"
thiserror = "2.0.0"

[features]
default = []
# Optional BLAS support. Enable with `--features blas` to link against system BLAS.
blas = ["ndarray/blas"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"