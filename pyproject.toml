[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "rsnumpy"
version = "1.2.10"
requires-python = ">=3.10"
description = "A Rust-powered NumPy-compatible array library."
readme = "PYPI.md"
# PEP 639：license 表达式 + 随包分发的许可文件（NOTICE 声明 NumPy 测试
# 代码的 BSD-3 归属，见仓库根目录 NOTICE）
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "YJ-Niu" },
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Visualization",
]

[tool.maturin]
module-name = "rsnumpy.num_core"
python-source = "python"
include = ["python/rsnumpy/__init__.py", "python/rsnumpy/exceptions.py", "python/rsnumpy/_core/__init__.py", "python/rsnumpy/_core/numeric.py", "python/rsnumpy/linalg/__init__.py", "python/rsnumpy/random/__init__.py", "python/rsnumpy/fft/__init__.py", "python/rsnumpy/typing/__init__.py"]
