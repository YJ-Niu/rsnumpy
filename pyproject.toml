[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "rsarray"
version = "1.2.10"
requires-python = ">=3.10"
description = "A high-performance array library powered by Rust."
readme = "PYPI.md"
# PEP 639：license 表达式 + 随包分发的许可文件
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "YJ-Niu" },
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Implementation :: CPython",
    "Programming Language :: Implementation :: PyPy",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Visualization",
]

[tool.pytest.ini_options]
# 钉 rootdir 到仓库根：缺此段时 pytest 不把 pyproject.toml 当 ini 文件，
# rootdir 会向上漂移到盘符根（Windows CI 曾因此全盘收集）；无参运行只
# 收集 tests/。norecursedirs 额外排除源码树：python/ 的包链带完整
# __init__.py，一旦被收集 pytest 会把 python/ 插入 sys.path，
# import rsarray 会加载无 num_core 的源码树。
testpaths = ["tests"]
norecursedirs = ["python", "target", "wheelhouse", "dist", ".venv"]

[tool.maturin]
module-name = "rsarray.num_core"
python-source = "python"
include = ["python/rsarray/__init__.py", "python/rsarray/exceptions.py", "python/rsarray/_core/__init__.py", "python/rsarray/_core/numeric.py", "python/rsarray/linalg/__init__.py", "python/rsarray/random/__init__.py", "python/rsarray/fft/__init__.py", "python/rsarray/typing/__init__.py"]
