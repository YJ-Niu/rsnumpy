name: CI

on:
  push:
    branches: [main, master, dev, main-dev]
  pull_request:
    branches: [main, master, dev, main-dev]

# 同一分支/PR 的新推送会取消仍在进行的旧运行，节省 CI 时间。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        # 固定 ubuntu-24.04：ubuntu-latest 自 2026-10 起迁移到 Ubuntu 26。
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python-version: ["3.10", "3.15"]
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          # -i python 绑定到当前矩阵版本；container:'off' 让 Linux 也直接在宿主机构建，
          # 从而与 setup-python 的版本一致（CI 只需能导入运行，无需 manylinux 合规）。
          args: --release --out dist -i python
          container: "off"
          sccache: "true"

      - name: Install built wheel
        run: python -m pip install --no-index --find-links dist rsnumpy

      - name: Run core test suite (pytest)
        # 每次构建的 wheel 都必须通过核心 pytest 套件（buffer 协议、逐元素算术、
        # 构造、索引、归约、比较；已知缺口用 xfail 钉住）。
        # 显式枚举核心测试文件（不跑 `pytest tests/` 整目录）——tests/numpy/ 是
        # 「NumPy 参照基准」harness，单独作为非门禁报告跑（见下一步），不并入门禁。
        run: |
          python -m pip install --quiet pytest
          python -m pytest \
            tests/test_buffer.py tests/test_arithmetic.py tests/test_creation.py \
            tests/test_indexing.py tests/test_reduction.py tests/test_comparison.py \
            tests/test_known_gaps.py -q

      - name: Run rsnumpy NumPy-compatibility check (non-gating report)
        # 用 NumPy 官方测试（tests/test_rsnumpy_*.py，~3400 用例，numpy 改名为 rsnumpy）
        # 作为参照基准验证 rsnumpy 的 NumPy 兼容性——被测对象是 rsnumpy，这些测试只是
        # ground truth。failed = rsnumpy 待修的 bug 或待补的 API，故 non-gating
        # （continue-on-error），只报告 pass/failed/skipped 摘要。构建模式跳过已知
        # C 扩展崩溃测试避免单进程中断。
        continue-on-error: true
        env:
          RSNUMPY_COMPAT_SKIP_CRASHES: "1"
        run: |
          python -m pytest \
            tests/test_rsnumpy_array_coercion.py tests/test_rsnumpy_indexing.py \
            tests/test_rsnumpy_numeric.py tests/test_rsnumpy_scalarmath.py \
            -q -p no:cacheprovider > numpy_compat.log 2>&1 || true
          python -c "print(open('numpy_compat.log', encoding='utf-8', errors='replace').read().splitlines()[-10:])"

      - name: Run smoke test
        run: python test/run_test.py

  lint:
    name: Lint (rustfmt + clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # pyo3 的 build script 需要一个 Python 解释器来探测 ABI。
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings
